<div class="container mt-4">
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let item of items">
      <div class="card h-100">
        <img [src]="item.imagemUrl" class="card-img-top" alt="Imagem do item">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">
            <a [href]="item.link" target="_blank" class="text-decoration-none">{{ item.titulo }}</a>
          </h5>
          <p class="card-text">{{ item.descricao }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
